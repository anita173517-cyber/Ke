name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Deep Scan and Build APK
        run: |
          echo "Deep scanning repository for Android project root..."
          
          # Find the directory containing app/build.gradle or settings.gradle
          PROJECT_DIR=""
          
          # Search for settings.gradle or settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle*" -not -path "*/.*" | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found project root via settings.gradle at: $PROJECT_DIR"
          else
            # Fallback: search for app/build.gradle
            APP_BUILD=$(find . -path "*/app/build.gradle*" -not -path "*/.*" | head -n 1)
            if [ -n "$APP_BUILD" ]; then
              PROJECT_DIR=$(dirname $(dirname "$APP_BUILD"))
              echo "Found project root via app folder at: $PROJECT_DIR"
            fi
          fi
          
          # If a valid project directory is found, move into it
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Moving to project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          else
            echo "Staying in root directory."
          fi
          
          # Ensure gradlew exists and is executable
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found, generating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          
          chmod +x gradlew
          echo "Executing Gradle build..."
          ./gradlew assembleRelease --no-daemon

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/outputs/apk/release/*.apk'
          
